name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "x-frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "x-frontend/**"

defaults:
  run:
    working-directory: x-frontend

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: x-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: x-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage -- --ci --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: x-frontend/coverage/

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: x-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Export for web
        run: npx expo export --platform web
      - name: Check bundle size
        run: |
          SIZE=$(du -sh dist/ | cut -f1)
          echo "Bundle size: $SIZE"
          BYTES=$(du -sb dist/ | cut -f1)
          if [ "$BYTES" -gt 10485760 ]; then
            echo "Bundle size exceeds 10MB!"
            exit 1
          fi
